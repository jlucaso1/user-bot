version: 1

AppDir:
  path: ./AppDir

  app_info:
    id: xstro
    name: xstro
    icon: xstro
    version: "${VERSION}"
    exec: usr/bin/xstro
    exec_args: $@

  runtime:
    arch: x86_64
    env:
      PATH: "${APPDIR}/usr/bin:${PATH}"

  files:
    include:
      - usr/bin/xstro
      - usr/share/icons/xstro.png
      - usr/share/applications/xstro.desktop

  test:
    fedora-30:
      image: appimagecrafters/tests-env:fedora-30
      command: ./AppRun --version
      use_host_x: true
    debian-stable:
      image: appimagecrafters/tests-env:debian-stable
      command: ./AppRun --version
      use_host_x: true
    ubuntu-xenial:
      image: appimagecrafters/tests-env:ubuntu-xenial
      command: ./AppRun --version
      use_host_x: true

AppImage:
  arch: x86_64
  file_name: xstro-${VERSION}.AppImage
