name: build-and-release

on:
  push:
    branches: [core]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v4
        with:
          go-version: 1.24.5

      - name: determine release vs nightly
        id: type
        run: |
          msg=$(git log -1 --pretty=%s)
          echo "type=$( [[ \"$msg\" == chore:* ]] && echo release || echo nightly )" >> $GITHUB_OUTPUT

      - name: compute version
        id: ver
        run: |
          if [[ "${{ steps.type.outputs.type }}" == "release" ]]; then
            tag=$(git describe --tags --exact-match HEAD || echo "${GITHUB_SHA::7}")
            echo "version=$tag" >> $GITHUB_OUTPUT
          else
            echo "version=nightly-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: collect release notes
        id: notes
        run: |
          git fetch --tags
          last_tag=$(git describe --tags --abbrev=0 || echo "")
          range="${last_tag:+$last_tag..}HEAD"
          notes=$(git log $range --pretty=format:"- [%h] %s%n%b")
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$notes" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: build binaries
        run: |
          mkdir -p dist/source
          rsync -a --exclude 'dist' ./ dist/source/
          mkdir -p dist/bin
          for os in windows linux darwin; do
            GOOS=$os GOARCH=amd64 go build -o dist/bin/xstro-$os .
          done

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.type.outputs.type }}-build-${{ steps.ver.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: create release (with binaries)
        if: steps.type.outputs.type == 'release' || steps.type.outputs.type == 'nightly'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.ver.outputs.version }}
          name: Release ${{ steps.ver.outputs.version }}
          prerelease: ${{ steps.type.outputs.type == 'nightly' }}
          body: |
            **changes since last release**
            ${{ steps.notes.outputs.notes }}
          artifacts: "dist/bin/*, dist/source"
          allowUpdates: true
