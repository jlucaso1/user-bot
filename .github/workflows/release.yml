name: build-and-release

on:
  push:
    branches: [core]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: fetch tags
        run: git fetch --tags

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"

      - name: determine version
        id: version
        run: |
          msg=$(git log -1 --pretty=%s)
          if [[ "$msg" == chore:* ]]; then
            version=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "v0.1.0-${GITHUB_SHA::7}")
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            version="nightly-${GITHUB_SHA::7}"
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: collect release notes
        id: notes
        run: |
          last_chore=$(git log --oneline --grep="^chore:" -1 --format="%H" || echo "")
          if [[ -n "$last_chore" ]]; then
            range="${last_chore}..HEAD"
          else
            range="HEAD"
          fi
          notes=$(git log $range --pretty=format:"- **%h** %s%n%b" --no-merges | grep -v "^$" || echo "- initial release")
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$notes" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: build binaries
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -o dist/xstro-windows-amd64.exe
          GOOS=linux GOARCH=amd64 go build -o dist/xstro-linux-amd64
          GOOS=darwin GOARCH=amd64 go build -o dist/xstro-darwin-amd64
          GOOS=darwin GOARCH=arm64 go build -o dist/xstro-darwin-arm64

      - name: create archives
        run: |
          version=${{ steps.version.outputs.version }}
          tar -czf xstro-${version}.tar.gz -C dist .
          cd dist && zip -r ../xstro-${version}.zip . && cd ..

      - name: check existing prerelease
        id: check_release
        run: |
          version="${{ steps.version.outputs.version }}"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: create or update release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body: |
            **changes since last release:**
            ${{ steps.notes.outputs.notes }}

            ---
            **download the right binary for your system:**
            - windows: `xstro-windows-amd64.exe`
            - linux: `xstro-linux-amd64`
            - macos intel: `xstro-darwin-amd64`
            - macos apple silicon: `xstro-darwin-arm64`

            archives:
            - `xstro-${{ steps.version.outputs.version }}.tar.gz` (unix/linux)
            - `xstro-${{ steps.version.outputs.version }}.zip` (windows)
          artifacts: |
            dist/*
            xstro-${{ steps.version.outputs.version }}.tar.gz
            xstro-${{ steps.version.outputs.version }}.zip
          allowUpdates: ${{ steps.check_release.outputs.exists == 'true' || steps.version.outputs.prerelease == 'false' }}
          makeLatest: ${{ steps.version.outputs.prerelease == 'false' }}
