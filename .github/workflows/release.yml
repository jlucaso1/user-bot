name: build-and-release

on:
  push:
    branches: [core]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: fetch all tags
        run: git fetch --tags

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.4" # Updated to latest stable version

      - name: determine release vs nightly
        id: type
        run: |
          msg=$(git log -1 --pretty=%s)
          type=$( [[ "$msg" == chore:* ]] && echo release || echo nightly )
          echo "type=$type" >> $GITHUB_OUTPUT

      - name: compute version
        id: ver
        run: |
          if [[ "${{ steps.type.outputs.type }}" == "release" ]]; then
            tag=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "v0.1.0-${GITHUB_SHA::7}")
            echo "version=$tag" >> $GITHUB_OUTPUT
          else
            echo "version=nightly-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: collect release notes
        id: notes
        run: |
          last_tag=$(git describe --tags --abbrev=0 @^ 2>/dev/null || echo "")
          range="${last_tag:+$last_tag..}HEAD"
          notes=$(git log $range --pretty=format:"- [%h] %s" || echo "- Initial release")
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$notes" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: build binaries
        run: |
          mkdir -p dist/bin dist/source
          rsync -a --exclude 'dist' ./ dist/source/

          # Build for different platforms with proper cross-compilation
          GOOS=windows GOARCH=amd64 go build -o dist/bin/xstro-windows.exe
          GOOS=linux GOARCH=amd64 go build -o dist/bin/xstro-linux
          GOOS=darwin GOARCH=amd64 go build -o dist/bin/xstro-darwin

      - name: prepare AppDir and icon
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons AppDir/usr/share/applications
          cp dist/bin/xstro-linux AppDir/usr/bin/xstro
          chmod +x AppDir/usr/bin/xstro

          # Create icon (ensure this file exists in your repo)
          if [ -f resources/logo.png ]; then
            cp resources/logo.png AppDir/usr/share/icons/xstro.png
          else
            # Create a simple placeholder icon if logo doesn't exist
            echo "Warning: resources/logo.png not found, you may need to add an icon"
          fi

      - name: create desktop file
        run: |
          cat > AppDir/usr/share/applications/xstro.desktop << EOF
          [Desktop Entry]
          Type=Application
          Name=xstro
          Exec=xstro
          Icon=xstro
          Comment=Xstro Application
          Categories=Utility;
          EOF

      - name: build AppImage
        uses: AppImageCrafters/build-appimage-action@v1.3
        with:
          recipe: ./AppImageBuilder.yml
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: create tar.zst
        run: |
          version=${{ steps.ver.outputs.version }}
          tar -C dist/bin -c . | zstd -o xstro-${version}.tar.zst

      - name: create zip
        run: |
          version=${{ steps.ver.outputs.version }}
          cd dist/bin && zip -r ../../xstro-${version}.zip .

      - name: create release
        if: steps.type.outputs.type == 'release' || steps.type.outputs.type == 'nightly'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.ver.outputs.version }}
          name: Release ${{ steps.ver.outputs.version }}
          prerelease: ${{ steps.type.outputs.type == 'nightly' }}
          body: |
            **Changes since last release:**
            ${{ steps.notes.outputs.notes }}
          artifacts: |
            dist/bin/*
            xstro-${{ steps.ver.outputs.version }}.tar.zst
            xstro-${{ steps.ver.outputs.version }}.zip
            *.AppImage
          allowUpdates: true
          makeLatest: ${{ steps.type.outputs.type == 'release' }}
