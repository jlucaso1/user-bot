name: build-and-release

on:
  push:
    branches: [core]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v4
        with:
          go-version: 1.24.5

      - name: determine release vs nightly
        id: type
        run: |
          msg=$(git log -1 --pretty=%s)
          type=$( [[ "$msg" == chore:* ]] && echo release || echo nightly )
          echo "type=$type" >> $GITHUB_OUTPUT

      - name: compute version
        id: ver
        run: |
          if [[ "${{ steps.type.outputs.type }}" == "release" ]]; then
            tag=$(git describe --tags --exact-match HEAD || echo "${GITHUB_SHA::7}")
            echo "version=$tag" >> $GITHUB_OUTPUT
          else
            echo "version=nightly-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: collect release notes
        id: notes
        run: |
          git fetch --tags
          last_tag=$(git describe --tags --abbrev=0 @^ || echo "")
          range="${last_tag:+$last_tag..}HEAD"
          notes=$(git log $range --pretty=format:"- [%h] %s%n%b")
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$notes" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: build binaries
        run: |
          mkdir -p dist/bin dist/source
          rsync -a --exclude 'dist' ./ dist/source/
          for os in windows linux darwin; do
            if [[ "$os" == "windows" ]]; then
              go build -o dist/bin/xstro-windows.exe
            else
              go build -o dist/bin/xstro-$os
            fi
          done

      - name: prepare AppDir and icon
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons
          cp dist/bin/xstro-linux AppDir/usr/bin/xstro
          cp resources/logo.png AppDir/usr/share/icons/xstro.png

      - name: build AppImage
        uses: AppImageCrafters/build-appimage-action@master
        with:
          recipe: ./AppImageBuilder.yml

      - name: create tar.zst
        run: |
          version=${{ steps.ver.outputs.version }}
          tar -C dist/bin -c . | zstd -o xstro-${version}.tar.zst

      - name: create zip
        run: |
          version=${{ steps.ver.outputs.version }}
          zip -r xstro-${version}.zip dist/bin

      - name: create release
        if: steps.type.outputs.type == 'release' || steps.type.outputs.type == 'nightly'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.ver.outputs.version }}
          name: Release ${{ steps.ver.outputs.version }}
          prerelease: ${{ steps.type.outputs.type == 'nightly' }}
          body: |
            **changes since last release**
            ${{ steps.notes.outputs.notes }}
          artifacts: |
            dist/bin/*,
            xstro-${{ steps.ver.outputs.version }}.tar.zst,
            xstro-${{ steps.ver.outputs.version }}.zip,
            *.AppImage
          allowUpdates: true
