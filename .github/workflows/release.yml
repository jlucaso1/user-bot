name: build-and-release

on:
  push:
    branches: [core]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: fetch tags
        run: git fetch --tags

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"

      - name: determine version
        id: version
        run: |
          msg=$(git log -1 --pretty=%s)
          if [[ "$msg" == chore:* ]]; then
            # Release version - try to get exact tag, fallback to commit
            version=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "v0.1.0-${GITHUB_SHA::7}")
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            # Nightly version
            version="nightly-${GITHUB_SHA::7}"
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: build binaries
        run: |
          mkdir -p dist

          # Build for different platforms
          GOOS=windows GOARCH=amd64 go build -o dist/xstro-windows-amd64.exe
          GOOS=linux GOARCH=amd64 go build -o dist/xstro-linux-amd64
          GOOS=darwin GOARCH=amd64 go build -o dist/xstro-darwin-amd64
          GOOS=darwin GOARCH=arm64 go build -o dist/xstro-darwin-arm64

      - name: create archives
        run: |
          version=${{ steps.version.outputs.version }}

          # Create tar.gz for Unix systems
          tar -czf xstro-${version}.tar.gz -C dist .

          # Create zip for Windows
          cd dist && zip -r ../xstro-${version}.zip . && cd ..

      - name: create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body: |
            **Download the right binary for your system:**
            - **Windows**: `xstro-windows-amd64.exe`
            - **Linux**: `xstro-linux-amd64`
            - **macOS Intel**: `xstro-darwin-amd64`
            - **macOS Apple Silicon**: `xstro-darwin-arm64`

            Or download the archives:
            - `xstro-${{ steps.version.outputs.version }}.tar.gz` (Unix/Linux)
            - `xstro-${{ steps.version.outputs.version }}.zip` (Windows)
          artifacts: |
            dist/*
            xstro-${{ steps.version.outputs.version }}.tar.gz
            xstro-${{ steps.version.outputs.version }}.zip
          allowUpdates: true
          makeLatest: ${{ steps.version.outputs.prerelease == 'false' }}
